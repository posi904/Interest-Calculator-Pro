<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- మొబైల్ స్క్రీన్‌ల కోసం వ్యూపోర్ట్ సెట్టింగ్ (Responsive Scaling) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interest Calculator - Neon Theme</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* ఐఫోన్/టచ్ బ్రౌజర్ హైలైట్ తొలగించడానికి */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #111116;
            font-family: 'Inter', sans-serif;
            color: #E0E0E0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* మొబైల్ బ్రౌజర్లలో స్క్రీన్ ఓవర్‌ఫ్లో కాకుండా */
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
            padding: 15px;
        }

        .header-text {
            color: #88E4ED;
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: capitalize;
            text-shadow: 0 0 8px rgba(136, 228, 237, 0.5);
            text-align: center;
        }

        .calculator-card {
            background: radial-gradient(circle at 50% -20%, #2B2B3F 0%, #1A1A2E 60%, #111116 100%);
            width: 100%;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #3A3A52;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(136, 228, 237, 0.08);
        }

        h2 {
            color: #FFFFFF;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
            width: 100%;
        }

        .input-group label {
            color: #9FA0B1;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="number"], select {
            background-color: #1A1A2E;
            border: 1px solid #414162;
            border-radius: 8px;
            padding: 12px;
            color: #FFFFFF;
            font-size: 1rem;
            width: 100%;
            appearance: none; /* సఫారి/క్రోమ్ డిఫాల్ట్ స్టైల్స్ తొలగించడానికి */
            -webkit-appearance: none;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #7AE0E8;
            box-shadow: 0 0 10px rgba(122, 224, 232, 0.3);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-group.half {
            width: 60%;
        }

        .dropdown-wrapper.half {
            width: 40%;
            position: relative;
        }

        /* ఐఫోన్ సఫారి మరియు ఆండ్రాయిడ్ క్రోమ్‌లో డ్రాప్‌డౌన్ యారో సరిగ్గా కనిపಿಸಲು */
        .dropdown-wrapper::after {
            content: '▼';
            font-size: 0.7rem;
            color: #9FA0B1;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .section-divider {
            color: #7AE0E8;
            font-size: 0.8rem;
            margin-top: 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .section-divider::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(to right, #414162, transparent);
            margin-left: 10px;
        }

        .error-message {
            background-color: rgba(239, 71, 111, 0.1);
            border: 1px solid #EF476F;
            color: #EF476F;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.8rem;
            margin-top: 15px;
            margin-bottom: 15px;
            display: block;
            text-align: left;
            box-shadow: 0 0 10px rgba(239, 71, 111, 0.2);
        }

        .error-message.hidden {
            display: none;
        }

        .calculate-btn {
            background: linear-gradient(to right, #88E4ED, #7AE0E8);
            color: #0F0F14;
            border: none;
            border-radius: 50px;
            padding: 15px;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 4px 20px rgba(122, 224, 232, 0.4);
            /* మొబైల్ టచ్ రెస్పాన్స్ మెరుగ్గా ఉండటానికి */
            cursor: pointer;
        }

        .calculate-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-text">Style 3: Neon / Tech Theme</div>
        
        <div class="calculator-card">
            <h2>Interest Calculator</h2>

            <div class="input-group">
                <label>Principal Amount</label>
                <input type="number" id="principal" value="1,000" placeholder="1,000">
            </div>

            <div class="section-divider">
                <span>Rate (% per month)</span>
            </div>

            <div class="input-row">
                <div class="input-group half">
                    <label>Interest Rate</label>
                    <input type="text" id="rate" placeholder="Enter rate..." value="10">
                </div>
                <div class="dropdown-wrapper half">
                    <select id="rateType">
                        <option value="month" selected>% per Month</option>
                        <option value="year">% per Annum</option>
                    </select>
                </div>
            </div>

            <div class="section-divider">
                <span>Time (Months)</span>
            </div>

            <div class="input-row">
                <div class="input-group half">
                    <label>Time Period</label>
                    <input type="text" id="time" placeholder="Enter time..." value="2">
                </div>
                <div class="dropdown-wrapper half">
                    <select id="timeType">
                        <option value="month" selected>Months</option>
                        <option value="year">Years</option>
                    </select>
                </div>
            </div>

            <div id="errorMessage" class="error-message hidden">
                Mismatch detected: Rate is Annual and Time is in Months. Please standardize to either both Annual or both Monthly.
            </div>

            <button class="calculate-btn">Calculate</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const rateTypeSelect = document.getElementById('rateType');
            const timeTypeSelect = document.getElementById('timeType');
            const errorMessage = document.getElementById('errorMessage');

            function checkMismatch() {
                const rateType = rateTypeSelect.value;
                const timeType = timeTypeSelect.value;

                if (rateType === 'year' && timeType === 'month') {
                    errorMessage.classList.remove('hidden');
                } else {
                    errorMessage.classList.add('hidden');
                }
            }

            rateTypeSelect.addEventListener('change', checkMismatch);
            timeTypeSelect.addEventListener('change', checkMismatch);
        });
    </script>
</body>
</html>
