<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interest Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #111116;
            font-family: 'Inter', sans-serif;
            color: #E0E0E0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
            padding: 15px;
        }

        .calculator-card {
            background: radial-gradient(circle at 50% -20%, #2B2B3F 0%, #1A1A2E 60%, #111116 100%);
            width: 100%;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #3A3A52;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(136, 228, 237, 0.08);
        }

        h2 {
            color: #FFFFFF;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
            width: 100%;
        }

        /* అన్ని లేబుల్స్ ఒకే కలర్‌లో ఉండేలా సెట్ చేయబడ్డాయి */
        .input-group label {
            color: #7AE0E8;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="number"], select {
            background-color: #1A1A2E;
            border: 1px solid #414162;
            border-radius: 8px;
            padding: 12px;
            color: #FFFFFF;
            font-size: 1rem;
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
        }

        input::placeholder {
            color: #6b6b83;
            opacity: 1;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #7AE0E8;
            box-shadow: 0 0 10px rgba(122, 224, 232, 0.3);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-group.half {
            width: 60%;
        }

        .dropdown-wrapper.half {
            width: 40%;
            position: relative;
        }

        .dropdown-wrapper::after {
            content: '▼';
            font-size: 0.7rem;
            color: #9FA0B1;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        select {
            padding-right: 30px;
            cursor: pointer;
        }

        .calculate-btn {
            background: linear-gradient(to right, #88E4ED, #7AE0E8);
            color: #0F0F14;
            border: none;
            border-radius: 50px;
            padding: 15px;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 20px rgba(122, 224, 232, 0.4);
        }

        .calculate-btn:active {
            opacity: 0.8;
        }

        .result-box {
            background-color: rgba(122, 224, 232, 0.1);
            border: 1px solid #7AE0E8;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
            color: #7AE0E8;
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .result-box.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="calculator-card">
            <h2>Interest Calculator</h2>

            <div class="input-group">
                <label>Principal Amount</label>
                <input type="number" id="principal" placeholder="e.g. 10000">
            </div>

            <div class="input-group">
                <label>Interest Rate</label>
                <div class="input-row" style="margin-bottom: 0;">
                    <div class="input-group half" style="width: 60%;">
                        <input type="number" id="rate" placeholder="e.g. 12">
                    </div>
                    <div class="dropdown-wrapper half" style="width: 40%;">
                        <select id="rateType">
                            <option value="month" selected>% per Month</option>
                            <option value="year">% per Annum</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="input-group" style="margin-top: 12px;">
                <label>Time Period</label>
                <div class="input-row" style="margin-bottom: 0;">
                    <div class="input-group half" style="width: 60%;">
                        <input type="number" id="time" placeholder="e.g. 5">
                    </div>
                    <div class="dropdown-wrapper half" style="width: 40%;">
                        <select id="timeType">
                            <option value="month" selected>Months</option>
                            <option value="year">Years</option>
                        </select>
                    </div>
                </div>
            </div>

            <button class="calculate-btn" id="calcBtn">Calculate</button>

            <div id="resultBox" class="result-box hidden">
                Total Interest: <span id="interestOutput">0</span> <br>
                Total Amount: <span id="totalOutput">0</span>
            </div>
        </div>
    </div>

    <script>
        const rateTypeSelect = document.getElementById('rateType');
        const timeTypeSelect = document.getElementById('timeType');
        const calcBtn = document.getElementById('calcBtn');
        const resultBox = document.getElementById('resultBox');
        const interestOutput = document.getElementById('interestOutput');
        const totalOutput = document.getElementById('totalOutput');

        calcBtn.addEventListener('click', () => {
            const principal = parseFloat(document.getElementById('principal').value);
            const rate = parseFloat(document.getElementById('rate').value);
            const time = parseFloat(document.getElementById('time').value);

            if (isNaN(principal) || isNaN(rate) || isNaN(time)) {
                alert("Please fill in all the required fields correctly.");
                return;
            }
            
            const rateType = rateTypeSelect.value;
            const timeType = timeTypeSelect.value;

            let totalInterest = 0;

            // అన్ని రకాల కాంబినేషన్ల లెక్కలు (మిస్‌మ్యాచ్ ఎర్రర్ తొలగించబడింది)
            if (rateType === 'month' && timeType === 'month') {
                // నెల వడ్డీ, నెలలు
                totalInterest = (principal * rate * time) / 100;
            } else if (rateType === 'year' && timeType === 'year') {
                // సంవత్సర వడ్డీ, సంవత్సరాలు
                totalInterest = (principal * rate * time) / 100;
            } else if (rateType === 'month' && timeType === 'year') {
                // నెల వడ్డీ, సంవత్సరాలు (సంవత్సరాలను నెలలుగా మార్చి లెక్కించుట)
                let totalMonths = time * 12;
                totalInterest = (principal * rate * totalMonths) / 100;
            } else if (rateType === 'year' && timeType === 'month') {
                // వార్షిక వడ్డీ (Annum), కానీ నెలల్లో టైమ్ (ఉదా: 5 నెలలు)
                // సంవత్సర వడ్డీని 12 తో భాగించి నెలవారీ వడ్డీగా మార్చి లెక్కించడం జరుగుతుంది
                let monthlyRate = rate / 12;
                totalInterest = (principal * monthlyRate * time) / 100;
            }

            const finalAmount = principal + totalInterest;

            interestOutput.textContent = totalInterest.toFixed(2);
            totalOutput.textContent = finalAmount.toFixed(2);
            resultBox.classList.remove('hidden');
        });
    </script>
</body>
</html>
