<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>వడ్డీ లెక్కల యాప్</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #219653;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f8f5;
            border-left: 5px solid #27ae60;
            border-radius: 4px;
        }
        .result h3 {
            margin: 0 0 10px 0;
            color: #117a65;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>వడ్డీ కాలిక్యులేటర్</h2>
    
    <div class="form-group">
        <label>అసలు మొత్తం (₹):</label>
        <input type="number" id="principal" placeholder="ఉదాహరణకు: 50000">
    </div>

    <div class="form-group">
        <label>వడ్డీ రేటు (%):</label>
        <input type="number" id="rate" placeholder="ఉదాహరణకు: 2 (రూపాయికి 2 వడ్డీ అయితే 2)">
    </div>

    <div class="form-group">
        <label>వడ్డీ రకం:</label>
        <select id="interestType">
            <option value="simple">సాధారణ వడ్డీ (Simple Interest)</option>
            <option value="compound">చಕ್ರ వడ్డీ (Compound Interest)</option>
        </select>
    </div>

    <div class="form-group">
        <label>కాలం (నెలల్లో):</label>
        <input type="number" id="months" placeholder="ఎన్ని నెలలు?">
    </div>

    <button onclick="calculateInterest()">లెక్కించండి</button>

    <div class="result" id="resultBox" style="display: none;">
        <h3>లెక్క వివరాలు:</h3>
        <p id="resInterest">వడ్డీ మొత్తం: ₹0</p>
        <p id="resTotal">మొత్తం చెల్లించాల్సింది: ₹0</p>
    </div>
</div>

<script>
    function calculateInterest() {
        let p = parseFloat(document.getElementById('principal').value);
        let r = parseFloat(document.getElementById('rate').value);
        let m = parseFloat(document.getElementById('months').value);
        let type = document.getElementById('interestType').value;

        if (isNaN(p) || isNaN(r) || isNaN(m)) {
            alert("దయచేసి అన్ని వివరాలను సరిగ్గా పూరించండి!");
            return;
        }

        let interest = 0;

        if (type === 'simple') {
            // నెలవారీ సాధారణ వడ్డీ సూత్రం: (అసలు * రేటు * నెలలు) / 100
            interest = (p * r * m) / 100;
        } else {
            // చక్ర వడ్డీ (నెలవారీ చక్రవడ్డీ)
            interest = p * (Math.pow((1 + r / 100), m)) - p;
        }

        let totalAmount = p + interest;

        document.getElementById('resInterest').innerText = "వడ్డీ మొత్తం: ₹" + interest.toFixed(2);
        document.getElementById('resTotal').innerText = "మొత్తం చెల్లించాల్సింది (అసలు + వడ్డీ): ₹" + totalAmount.toFixed(2);
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
