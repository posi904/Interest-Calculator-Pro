<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .calculator-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <h2>Interest Calculator</h2>
    
    <div class="form-group">
        <label for="principal">Principal Amount:</label>
        <input type="number" id="principal" placeholder="Enter principal amount here">
    </div>

    <div class="form-group">
        <label for="rate">Interest Rate (% per annum):</label>
        <input type="number" id="rate" placeholder="Enter interest rate here">
    </div>

    <div class="form-group">
        <label for="time">Time Period (Months):</label>
        <input type="number" id="time" placeholder="Enter time period in months here">
    </div>

    <div class="form-group">
        <label for="interestType">Interest Type:</label>
        <select id="interestType">
            <option value="simple">Simple Interest</option>
            <option value="compound">Compound Interest</option>
        </select>
    </div>

    <button onclick="calculateInterest()">Calculate Interest</button>

    <div class="result" id="resultContainer" style="display: none;">
        <h3>Result</h3>
        <p id="interestOutput"></p>
        <p id="totalOutput"></p>
    </div>
</div>

<script>
    function calculateInterest() {
        const principal = parseFloat(document.getElementById('principal').value);
        const rate = parseFloat(document.getElementById('rate').value);
        const months = parseFloat(document.getElementById('time').value);
        const type = document.getElementById('interestType').value;

        if (isNaN(principal) || isNaN(rate) || isNaN(months)) {
            alert("Please fill in all fields with valid numbers.");
            return;
        }

        // Convert months into years for standard calculation
        const timeInYears = months / 12;

        let interest = 0;
        let totalAmount = 0;

        if (type === "simple") {
            interest = (principal * rate * timeInYears) / 100;
            totalAmount = principal + interest;
        } else {
            totalAmount = principal * Math.pow((1 + (rate / 100)), timeInYears);
            interest = totalAmount - principal;
        }

        document.getElementById('interestOutput').innerText = "Interest: " + interest.toFixed(2);
        document.getElementById('totalOutput').innerText = "Total Amount: " + totalAmount.toFixed(2);
        document.getElementById('resultContainer').style.display = "block";
    }
</script>

</body>
</html>
